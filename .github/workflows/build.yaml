name: Build
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          cache-dependency-path: go/go.sum

      - name: Test
        run: go test -mod=readonly ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: go
          args: --timeout=3m0s
